name: Build Windows Installer

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean package -DskipTests
    
    - name: Prepare jpackage
      run: |
        mkdir -p target/jpackage-input
        copy target\yt-dlp-studio-5.1.0.jar target\jpackage-input\
    
    - name: Generate Windows Installer (EXE)
      run: |
        $javaHome = $env:JAVA_HOME
        & "$javaHome\bin\jpackage.exe" `
          --input target/jpackage-input `
          --name yt-dlp-studio `
          --main-jar yt-dlp-studio-5.1.0.jar `
          --main-class YtDlpStudio `
          --type exe `
          --app-version 5.1.0 `
          --vendor "KA-Laboratory" `
          --description "Modern yt-dlp GUI for Windows" `
          --icon src/main/resources/app.ico `
          --win-menu `
          --win-shortcut `
          --dest target/installers
    
    - name: Generate Windows Installer (MSI)
      run: |
        $javaHome = $env:JAVA_HOME
        & "$javaHome\bin\jpackage.exe" `
          --input target/jpackage-input `
          --name yt-dlp-studio `
          --main-jar yt-dlp-studio-5.1.0.jar `
          --main-class YtDlpStudio `
          --type msi `
          --app-version 5.1.0 `
          --vendor "KA-Laboratory" `
          --description "Modern yt-dlp GUI for Windows" `
          --icon src/main/resources/app.ico `
          --win-menu `
          --win-shortcut `
          --dest target/installers
    
    - name: List generated installers
      run: dir target/installers
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          target/installers/*.exe
          target/installers/*.msi
          target/yt-dlp-studio-5.1.0.jar
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload artifacts
      if: '!startsWith(github.ref, ''refs/tags/'')'
      uses: actions/upload-artifact@v4
      with:
        name: windows-installers
        path: |
          target/installers/*.exe
          target/installers/*.msi
          target/yt-dlp-studio-5.1.0.jar
        retention-days: 30
